<div
  class="modal-shell"
  [class.larga]="largura() === 'larga'"
  [class.cheia]="largura() === 'cheia'"
  role="document"
>
  <header class="modal-header">
    <h2>{{ titulo() }}</h2>
    <button type="button" class="modal-close" aria-label="Fechar" (click)="fechar.emit()">×</button>
  </header>
  <div class="modal-body">
    <ng-content />
  </div>
  <footer class="modal-footer">
    <ng-content select="[modalFooter]" />
  </footer>
</div>
