<svg
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.8"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
  [class.icon-spin]="name() === 'spinner'"
>
  @switch (name()) {
    @case ('menu') {
      <line x1="3" y1="6" x2="21" y2="6" />
      <line x1="3" y1="12" x2="21" y2="12" />
      <line x1="3" y1="18" x2="21" y2="18" />
    }
    @case ('close') {
      <line x1="18" y1="6" x2="6" y2="18" />
      <line x1="6" y1="6" x2="18" y2="18" />
    }
    @case ('chevron-left') {
      <polyline points="15 18 9 12 15 6" />
    }
    @case ('chevron-right') {
      <polyline points="9 18 15 12 9 6" />
    }
    @case ('chevron-down') {
      <polyline points="6 9 12 15 18 9" />
    }
    @case ('oportunidades') {
      <rect x="2" y="7" width="20" height="13" rx="2" />
      <path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
      <line x1="2" y1="12" x2="22" y2="12" />
    }
    @case ('alertas') {
      <path d="M18 8a6 6 0 0 0-12 0c0 5-2 6-2 6h16s-2-1-2-6" />
      <path d="M10.5 20a1.5 1.5 0 0 0 3 0" />
    }
    @case ('filtros') {
      <line x1="4" y1="6" x2="20" y2="6" />
      <line x1="4" y1="12" x2="20" y2="12" />
      <line x1="4" y1="18" x2="20" y2="18" />
      <circle cx="9" cy="6" r="2" />
      <circle cx="15" cy="12" r="2" />
      <circle cx="9" cy="18" r="2" />
    }
    @case ('user') {
      <circle cx="12" cy="8" r="4" />
      <path d="M4 20c0-4 4-6 8-6s8 2 8 6" />
    }
    @case ('logout') {
      <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
      <polyline points="10 17 15 12 10 7" />
      <line x1="15" y1="12" x2="3" y2="12" />
    }
    @case ('edit') {
      <path d="M12 20h9" />
      <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z" />
    }
    @case ('spinner') {
      <!-- Arco de 270°, não círculo fechado — é o giro do traço que lê como
           "carregando", não a forma parada. -->
      <path d="M21 12a9 9 0 1 1-9-9" />
    }
    @case ('arrow-right') {
      <path d="M5.25 12h13.5" />
      <path d="M13.5 6.75L18.75 12 13.5 17.25" />
    }
    @case ('arrow-up') {
      <path d="M12 18.75V5.25" />
      <path d="M6.75 10.5L12 5.25 17.25 10.5" />
    }
    @case ('download') {
      <path d="M12 4.2v11.1" />
      <path d="M7.2 10.5L12 15.3 16.8 10.5" />
      <path d="M4.8 19.8h14.4" />
    }
    @case ('external-link') {
      <path d="M13.8 5.1h5.1v5.1" />
      <path d="M18.9 5.1L11.1 12.9" />
      <path d="M17.1 14.4v4.5H5.1V6.9h4.5" />
    }
    @case ('check') {
      <polyline points="5 13 10 18 19 7" />
    }
    @case ('cotador') {
      <rect x="4" y="2.5" width="16" height="19" rx="2" />
      <rect x="7.5" y="6" width="9" height="3.5" rx="0.6" />
      <line x1="8" y1="13" x2="8" y2="13" />
      <line x1="12" y1="13" x2="12" y2="13" />
      <line x1="16" y1="13" x2="16" y2="13" />
      <line x1="8" y1="17" x2="8" y2="17" />
      <line x1="12" y1="17" x2="12" y2="17" />
      <line x1="16" y1="17" x2="16" y2="17" />
    }
    @case ('bookmark') {
      <path d="M7 3.8h10a1 1 0 0 1 1 1v15.4l-6-4.2-6 4.2V4.8a1 1 0 0 1 1-1Z" />
    }
    @case ('calendar') {
      <rect x="3" y="5" width="18" height="16" rx="2" />
      <line x1="3" y1="10" x2="21" y2="10" />
      <line x1="8" y1="3" x2="8" y2="7" />
      <line x1="16" y1="3" x2="16" y2="7" />
    }
    @case ('chevron-up') {
      <polyline points="6 15 12 9 18 15" />
    }
    @case ('exclamation') {
      <line x1="12" y1="6" x2="12" y2="13" />
      <line x1="12" y1="17" x2="12" y2="17.01" />
    }
    @case ('eye') {
      <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" />
      <circle cx="12" cy="12" r="3" />
    }
    @case ('search') {
      <circle cx="11" cy="11" r="6.5" />
      <line x1="16" y1="16" x2="21" y2="21" />
    }
    @case ('fornecedores') {
      <path d="M3 21h18" />
      <path d="M5 21V8l7-4 7 4v13" />
      <rect x="9" y="12" width="6" height="9" />
      <line x1="9" y1="8.5" x2="9" y2="8.51" />
      <line x1="15" y1="8.5" x2="15" y2="8.51" />
    }
    @case ('plus') {
      <line x1="12" y1="5" x2="12" y2="19" />
      <line x1="5" y1="12" x2="19" y2="12" />
    }
    @case ('calculadora') {
      <rect x="5" y="2.5" width="14" height="19" rx="2" />
      <rect x="8" y="5.5" width="8" height="3" rx="0.6" />
      <line x1="9" y1="12" x2="9" y2="12.01" />
      <line x1="12" y1="12" x2="12" y2="12.01" />
      <line x1="15" y1="12" x2="15" y2="12.01" />
      <line x1="9" y1="15.5" x2="9" y2="15.51" />
      <line x1="12" y1="15.5" x2="12" y2="15.51" />
      <line x1="15" y1="15.5" x2="15" y2="18.5" />
      <line x1="9" y1="18.5" x2="12" y2="18.5" />
    }
    @case ('copiar') {
      <rect x="9" y="9" width="11" height="11" rx="2" />
      <path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1" />
    }
    @case ('spreadsheet') {
      <rect x="3.5" y="3.5" width="17" height="17" rx="2" />
      <line x1="3.5" y1="9" x2="20.5" y2="9" />
      <line x1="9" y1="9" x2="9" y2="20.5" />
      <line x1="3.5" y1="15" x2="20.5" y2="15" />
    }
    @case ('trash') {
      <path d="M4 7h16" />
      <path d="M10 4h4a1 1 0 0 1 1 1v2H9V5a1 1 0 0 1 1-1Z" />
      <path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12" />
      <line x1="10" y1="11" x2="10" y2="17" />
      <line x1="14" y1="11" x2="14" y2="17" />
    }
  }
</svg>
