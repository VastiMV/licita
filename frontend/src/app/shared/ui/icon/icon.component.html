<svg
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.8"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
  [class.icon-spin]="name() === 'spinner'"
>
  @switch (name()) {
    @case ('menu') {
      <line x1="3" y1="6" x2="21" y2="6" />
      <line x1="3" y1="12" x2="21" y2="12" />
      <line x1="3" y1="18" x2="21" y2="18" />
    }
    @case ('close') {
      <line x1="18" y1="6" x2="6" y2="18" />
      <line x1="6" y1="6" x2="18" y2="18" />
    }
    @case ('chevron-left') {
      <polyline points="15 18 9 12 15 6" />
    }
    @case ('chevron-right') {
      <polyline points="9 18 15 12 9 6" />
    }
    @case ('chevron-down') {
      <polyline points="6 9 12 15 18 9" />
    }
    @case ('oportunidades') {
      <rect x="2" y="7" width="20" height="13" rx="2" />
      <path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
      <line x1="2" y1="12" x2="22" y2="12" />
    }
    @case ('alertas') {
      <path d="M18 8a6 6 0 0 0-12 0c0 5-2 6-2 6h16s-2-1-2-6" />
      <path d="M10.5 20a1.5 1.5 0 0 0 3 0" />
    }
    @case ('filtros') {
      <line x1="4" y1="6" x2="20" y2="6" />
      <line x1="4" y1="12" x2="20" y2="12" />
      <line x1="4" y1="18" x2="20" y2="18" />
      <circle cx="9" cy="6" r="2" />
      <circle cx="15" cy="12" r="2" />
      <circle cx="9" cy="18" r="2" />
    }
    @case ('user') {
      <circle cx="12" cy="8" r="4" />
      <path d="M4 20c0-4 4-6 8-6s8 2 8 6" />
    }
    @case ('logout') {
      <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
      <polyline points="10 17 15 12 10 7" />
      <line x1="15" y1="12" x2="3" y2="12" />
    }
    @case ('edit') {
      <path d="M12 20h9" />
      <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z" />
    }
    @case ('spinner') {
      <!-- Arco de 270°, não círculo fechado — é o giro do traço que lê como
           "carregando", não a forma parada. -->
      <path d="M21 12a9 9 0 1 1-9-9" />
    }
    @case ('arrow-right') {
      <path d="M5.25 12h13.5" />
      <path d="M13.5 6.75L18.75 12 13.5 17.25" />
    }
    @case ('download') {
      <path d="M12 4.2v11.1" />
      <path d="M7.2 10.5L12 15.3 16.8 10.5" />
      <path d="M4.8 19.8h14.4" />
    }
    @case ('external-link') {
      <path d="M13.8 5.1h5.1v5.1" />
      <path d="M18.9 5.1L11.1 12.9" />
      <path d="M17.1 14.4v4.5H5.1V6.9h4.5" />
    }
    @case ('check') {
      <polyline points="5 13 10 18 19 7" />
    }
  }
</svg>
