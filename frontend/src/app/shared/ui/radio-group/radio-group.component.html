<fieldset class="radio-group" [attr.aria-label]="label() || null">
  @if (label()) {
    <legend class="field-label">{{ label() }}</legend>
  }
  @for (option of options(); track option.value) {
    <label class="radio" [for]="idDe(option)">
      <input
        [id]="idDe(option)"
        type="radio"
        [name]="name"
        [value]="option.value"
        [checked]="value() === option.value"
        [disabled]="disabled()"
        (change)="handleChange(option.value)"
      />
      <span>{{ option.label }}</span>
    </label>
  }
</fieldset>
