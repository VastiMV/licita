<header class="topbar">
  <button
    type="button"
    class="hamburger"
    (click)="sidebarState.toggleMobile()"
    aria-label="Abrir menu"
    [attr.aria-expanded]="sidebarState.mobileOpen()"
  >
    <app-icon name="menu" />
  </button>

  <app-brand class="topbar-brand" [compact]="true" />

  <app-profile-menu class="account" />
</header>
