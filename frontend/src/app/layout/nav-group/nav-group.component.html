@if (compact()) {
  <!-- Trilho de ícones: sem o pai, os filhos ficam acessíveis por tooltip. -->
  @for (item of itens(); track item.path) {
    <app-nav-item [path]="item.path" [label]="item.label" [icon]="item.icon" [compact]="true" />
  }
} @else {
  <button
    type="button"
    class="grupo-cabecalho"
    [attr.aria-expanded]="aberto()"
    (click)="alternar()"
  >
    <app-icon [name]="icon()" />
    <span class="label">{{ label() }}</span>
    <app-icon [name]="aberto() ? 'chevron-up' : 'chevron-down'" class="grupo-seta" />
  </button>

  @if (aberto()) {
    <div class="grupo-itens">
      @for (item of itens(); track item.path) {
        <app-nav-item [path]="item.path" [label]="item.label" [icon]="item.icon" />
      }
    </div>
  }
}
