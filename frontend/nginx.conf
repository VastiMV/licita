# SPA estática: qualquer rota que não seja um arquivo real cai no
# index.html, pra o router do Angular assumir o roteamento client-side.
# /api/* não é tratado aqui — em produção o Ingress manda esse prefixo pro
# serviço do backend (ver docs/ARQUITETURA.md); esta imagem só serve os
# arquivos estáticos.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /favicon.ico {
    log_not_found off;
  }
}
