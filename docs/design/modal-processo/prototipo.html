<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--surface-000:#dde5ef;--surface-100:#ffffff;--surface-200:#eef2f7;--line:#ced7e3;--line-strong:#8794a8;--ink:#16294d;--ink-muted:#56677f;--brand:#16294d;--brand-ink:#ffffff;--brand-soft:#e2ebf6;--brand-text:#1d5ea6;--accent:#2b7cc4;--warn:#b87500;--warn-soft:#fdf6ea;--warn-text:#7a4b00;--danger:#b23a24;--danger-soft:#f8e2dc;--danger-text:#8a2a18;--success:#2a7a43;--success-soft:#e1f0e5;--success-text:#1d5a31;--neutral:#6b7068;--neutral-soft:#e8ecf2;--scrim:#16294d8c;--shadow-modal:0 24px 64px rgba(22,41,77,0.22), 0 2px 6px rgba(22,41,77,0.08);--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--radius-sm:4px;--radius-md:8px;--radius-lg:14px;--radius-pill:999px;--font-sans:Raleway, system-ui, -apple-system, "Segoe UI", sans-serif;--font-mono:Raleway, system-ui, sans-serif;}
body{margin:0;background:var(--surface-000)}
/* Licita — estilos do modal do processo. Usa só as variáveis de tokens.css. */
.lc, .lc * { box-sizing: border-box; }
.lc { font-family: var(--font-sans); color: var(--ink); font-size: 14px; line-height: 20px; -webkit-font-smoothing: antialiased; }
.lc button { font: inherit; }
.lc .num { font-family: var(--font-mono); font-variant-numeric: lining-nums tabular-nums; font-feature-settings: 'lnum' 1, 'tnum' 1; }
.lc { font-variant-numeric: lining-nums; font-feature-settings: 'lnum' 1; }
.lc svg { flex: none; }

/* ---------- véu + modal ---------- */
.lc-scrim { background: var(--scrim); padding: 24px; display: flex; justify-content: center; align-items: flex-start; min-height: 100%; }
.lc-modal { container-type: inline-size; width: min(1120px, 100%); max-height: calc(100vh - 48px); display: flex; flex-direction: column;
  background: var(--surface-100); border-radius: var(--radius-lg); box-shadow: var(--shadow-modal); overflow: hidden; }
.lc-modal.is-static { max-height: none; }

/* ---------- cabeçalho ---------- */
.lc-head { padding: 18px 24px 16px; border-bottom: 1px solid var(--line); }
.lc-head-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.lc-chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: var(--radius-sm); background: var(--surface-200); color: var(--ink-muted); font-size: 12px; line-height: 18px; white-space: nowrap; }
.lc-chip b { color: var(--ink); font-weight: 600; }
.lc-head-links { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.lc-link { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: var(--radius-md); color: var(--brand-text); font-size: 13px; font-weight: 500; text-decoration: none; }
.lc-link:hover { background: var(--brand-soft); }
.lc-icon-btn { width: 32px; height: 32px; display: inline-grid; place-items: center; border: 0; background: transparent; border-radius: var(--radius-md); color: var(--ink-muted); cursor: pointer; }
.lc-icon-btn:hover { background: var(--surface-200); color: var(--ink); }
.lc-title { margin: 10px 0 2px; font-size: 21px; line-height: 28px; font-weight: 700; letter-spacing: -0.005em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.lc-orgao { color: var(--ink-muted); }
.lc-facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin: 14px 0 0; }
.lc-fact dt { font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-muted); }
.lc-fact dd { margin: 3px 0 0; font-weight: 600; }
.lc-fact dd small { font-family: var(--font-sans); display: block; font-weight: 400; font-size: 12px; line-height: 16px; color: var(--ink-muted); }
.lc-fact dd.is-warn small { color: var(--warn-text); font-weight: 600; }

/* ---------- faixa de situação ---------- */
.lc-faixa { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--radius-md); background: var(--surface-200); }
.lc-faixa-ico { width: 32px; height: 32px; border-radius: var(--radius-pill); display: grid; place-items: center; color: var(--surface-100); background: var(--neutral); }
.lc-faixa-txt { flex: 1; min-width: 0; }
.lc-faixa-tag { font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.lc-faixa h3 { margin: 2px 0 0; font-size: 16px; line-height: 22px; font-weight: 600; }
.lc-faixa p { margin: 4px 0 0; }
.lc-faixa-when { text-align: right; font-size: 12px; line-height: 16px; white-space: nowrap; }
.lc-faixa-when b { display: block; font-size: 14px; line-height: 20px; }
.lc-faixa--andamento { background: var(--brand-soft); color: var(--brand-text); } .lc-faixa--andamento .lc-faixa-ico { background: var(--brand); color: var(--brand-ink); }
.lc-faixa--neutral { background: var(--neutral-soft); color: var(--ink); } .lc-faixa--neutral .lc-faixa-ico { background: var(--neutral); }
.lc-faixa--warn { border: 1px dashed color-mix(in srgb, var(--warn) 35%, transparent); background: var(--warn-soft); color: var(--warn-text); } .lc-faixa--warn .lc-faixa-ico { background: var(--warn); }
.lc-faixa--danger { background: var(--danger-soft); color: var(--danger-text); } .lc-faixa--danger .lc-faixa-ico { background: var(--danger); }
.lc-faixa--success { background: var(--success-soft); color: var(--success-text); } .lc-faixa--success .lc-faixa-ico { background: var(--success); }
.lc-faixa p, .lc-faixa-when { color: inherit; opacity: .92; }
.lc-aviso { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 3px 8px; border-radius: var(--radius-sm); background: var(--warn-soft); color: var(--warn-text); font-size: 12px; line-height: 16px; font-weight: 600; }

/* ---------- etapas do ciclo ---------- */
.lc-ciclo { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.lc-step { position: relative; padding-top: 30px; padding-right: 8px; }
.lc-step::before { content: ""; position: absolute; top: 11px; left: 24px; right: 0; height: 2px; background: var(--line); }
.lc-step:last-child::before { display: none; }
.lc-step.is-done::before { background: var(--brand); }
.lc-step.is-skip::before { background: repeating-linear-gradient(90deg, var(--line-strong) 0 4px, transparent 4px 8px); }
.lc-dot { position: absolute; top: 0; left: 0; width: 24px; height: 24px; border-radius: var(--radius-pill); display: grid; place-items: center;
  border: 2px solid var(--line-strong); background: var(--surface-100); color: var(--surface-100); }
.lc-step.is-done .lc-dot { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.lc-step.is-current .lc-dot { border-color: var(--accent); box-shadow: 0 0 0 4px var(--brand-soft); }
.lc-step.is-current .lc-dot::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.lc-step.is-stop .lc-dot { border-color: transparent; color: var(--surface-100); }
.lc-step.is-stop.f-warn .lc-dot { background: var(--warn); } .lc-step.is-stop.f-danger .lc-dot { background: var(--danger); }
.lc-step.is-stop.f-neutral .lc-dot { background: var(--neutral); } .lc-step.is-stop.f-success .lc-dot { background: var(--success); }
.lc-step.is-after .lc-dot { border-style: dashed; border-color: var(--line); }
.lc-step.is-skip .lc-dot { background: var(--surface-100); border-color: var(--line-strong); border-style: dashed; }
.lc-step-name { font-weight: 600; }
.lc-step.is-after .lc-step-name { color: var(--ink-muted); font-weight: 500; }
.lc-step-sub { font-size: 12px; line-height: 16px; color: var(--ink-muted); }
.lc-step.is-stop .lc-step-sub { font-weight: 600; }
.lc-step.is-stop.f-warn .lc-step-sub { color: var(--warn-text); } .lc-step.is-stop.f-danger .lc-step-sub { color: var(--danger-text); }
.lc-step.is-stop.f-success .lc-step-sub { color: var(--success-text); }
.lc-step.is-current .lc-step-sub { color: var(--brand-text); font-weight: 600; }

/* ---------- área fixa (faixa + ciclo) e corpo rolável ---------- */
.lc-status { padding: 16px 24px 18px; display: grid; gap: 18px; border-bottom: 1px solid var(--line); }
.lc-body { flex: 1; min-height: 0; overflow: auto; display: grid; grid-template-columns: minmax(0, 1fr) 300px; }
.lc-main { padding: 20px 24px 24px; min-width: 0; }
.lc-aside { padding: 20px 24px 24px 0; display: grid; gap: 14px; align-content: start; }
.lc-sec-title { font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 12px; display: flex; justify-content: space-between; align-items: baseline; }
.lc-sec-title button { border: 0; background: none; color: var(--brand-text); font-size: 12px; font-weight: 600; letter-spacing: 0; text-transform: none; cursor: pointer; padding: 0; }

/* ---------- linha do tempo ---------- */
.lc-tl { position: relative; }
.lc-tl-stage { position: relative; padding-left: 36px; padding-bottom: 6px; }
.lc-tl-stage::before { content: ""; position: absolute; left: 11px; top: 26px; bottom: 0; width: 2px; background: var(--line); }
.lc-tl-stage:last-child::before { display: none; }
.lc-tl-stage-head { position: relative; display: flex; align-items: baseline; gap: 8px; min-height: 24px; margin-bottom: 8px; }
.lc-tl-stage-head::before { content: ""; position: absolute; left: -31px; top: 4px; width: 14px; height: 14px; border-radius: var(--radius-sm); background: var(--surface-100); border: 2px solid var(--brand); }
.lc-tl-stage-head h4 { margin: 0; font-size: 14px; line-height: 20px; font-weight: 600; }
.lc-tl-stage-head span { font-size: 12px; color: var(--ink-muted); }
.lc-ev { position: relative; display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 6px 0 10px; }
.lc-av { width: 28px; height: 28px; border-radius: var(--radius-pill); display: grid; place-items: center; font-size: 11px; font-weight: 600; background: var(--brand-soft); color: var(--brand-text); }
.lc-av--sys { background: transparent; border: 1.5px dashed var(--line-strong); color: var(--ink-muted); border-radius: var(--radius-md); }
.lc-ev-txt { min-width: 0; }
.lc-ev-txt .t { display: block; }
.lc-ev-txt .m { display: block; font-size: 12px; line-height: 16px; color: var(--ink-muted); margin-top: 1px; }
.lc-ev--sys .t { color: var(--ink-muted); font-style: italic; }
.lc-ev-val { text-align: right; font-weight: 600; white-space: nowrap; padding-top: 1px; }
.lc-ev-val small { display: block; font-weight: 400; font-size: 12px; color: var(--ink-muted); font-family: var(--font-sans); }
.lc-tag-sys { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: var(--radius-sm); border: 1px solid var(--line); font-size: 11px; line-height: 16px; font-style: normal; color: var(--ink-muted); vertical-align: 1px; }

/* grupo de salvamentos da cotação */
.lc-grp { margin: 2px 0 8px 38px; border-radius: var(--radius-md); background: var(--surface-200); }
.lc-grp > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 10px 12px; }
.lc-grp > summary::-webkit-details-marker { display: none; }
.lc-grp-chev { color: var(--ink-muted); transition: transform .15s; }
.lc-grp[open] .lc-grp-chev { transform: rotate(90deg); }
.lc-grp-txt { flex: 1; min-width: 0; }
.lc-grp-txt b { font-weight: 600; }
.lc-grp-txt .m { display: block; font-size: 12px; line-height: 16px; color: var(--ink-muted); }
.lc-spark { width: 96px; height: 28px; }
.lc-spark path { fill: none; stroke: var(--accent); stroke-width: 1.5; }
.lc-spark circle { fill: var(--accent); }
.lc-grp-tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.lc-grp-tbl th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-muted); padding: 6px 12px; border-top: 1px solid var(--line); }
.lc-grp-tbl td { padding: 6px 12px; border-top: 1px solid var(--line); vertical-align: top; }
.lc-grp-tbl td:last-child, .lc-grp-tbl th:last-child { text-align: right; }
.lc-delta-up { color: var(--ink-muted); }

/* desfecho no fim da linha do tempo */
.lc-tl-end { position: relative; padding-left: 36px; padding-top: 4px; }
.lc-tl-end-dot { position: absolute; left: 0; top: 4px; width: 24px; height: 24px; border-radius: var(--radius-pill); display: grid; place-items: center; color: var(--surface-100); background: var(--neutral); }
.lc-tl-end.f-warn .lc-tl-end-dot { background: var(--warn); } .lc-tl-end.f-danger .lc-tl-end-dot { background: var(--danger); }
.lc-tl-end.f-success .lc-tl-end-dot { background: var(--success); } .lc-tl-end.f-andamento .lc-tl-end-dot { background: var(--surface-100); border: 2px dashed var(--brand); }
.lc-tl-end b { display: block; }
.lc-tl-end .sub { font-size: 12px; color: var(--ink-muted); }

/* ---------- lateral ---------- */
.lc-card { border: 1px solid var(--line); border-radius: var(--radius-md); padding: 14px 16px; }
.lc-card h5 { margin: 0 0 10px; font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-muted); }
.lc-kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 12px; margin: 0; }
.lc-kv dt { color: var(--ink-muted); white-space: nowrap; }
.lc-kv dd { margin: 0; text-align: right; font-weight: 600; }
.lc-card--future { border-style: dashed; }
.lc-card--future p { margin: 0; color: var(--ink-muted); font-size: 13px; }
.lc-people { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.lc-people li { display: flex; align-items: center; gap: 8px; }
.lc-people .lc-av { width: 24px; height: 24px; font-size: 10px; }
.lc-people small { margin-left: auto; color: var(--ink-muted); font-size: 12px; }

/* ---------- rodapé / ações ---------- */
.lc-foot { display: flex; align-items: center; gap: 8px; padding: 12px 24px; border-top: 1px solid var(--line); background: var(--surface-100); }
.lc-foot-note { margin-right: auto; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-muted); font-size: 13px; }
.lc-btn { color: var(--ink); display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: var(--radius-md); border: 1px solid var(--line-strong); background: var(--surface-100); font-weight: 500; cursor: pointer; white-space: nowrap; }
.lc-btn:hover { background: var(--surface-200); }
.lc-btn--primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.lc-btn--primary:hover { background: var(--brand); filter: brightness(1.08); }
.lc-btn--ghost { border-color: transparent; background: transparent; }
.lc-btn--danger { border-color: transparent; background: transparent; color: var(--danger-text); }
.lc-btn[disabled] { cursor: not-allowed; color: var(--ink-muted); border-style: dashed; background: transparent; }
.lc-soon { font-size: 10px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 1px 5px; border-radius: var(--radius-sm); background: var(--surface-200); color: var(--ink-muted); }
.lc :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

/* ---------- notebook / telas estreitas ---------- */
@container (max-width: 900px) {
  .lc-facts { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .lc-body { grid-template-columns: minmax(0, 1fr); }
  .lc-aside { padding: 0 24px 24px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .lc-head-links .lc-link span { display: none; }
  .lc-foot-note .long { display: none; }
}
@container (max-width: 620px) {
  .lc-step-sub { display: none; }
  .lc-faixa { flex-wrap: wrap; } .lc-faixa-when { text-align: left; width: 100%; padding-left: 44px; }
  .lc-foot { flex-wrap: wrap; } .lc-foot-note { width: 100%; }
}

/* ---------- moldura das prévias (não faz parte do produto) ---------- */
.pv { font-family: var(--font-sans); color: var(--ink); background: var(--surface-000); min-height: 100vh; }
.pv-bar { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 24px 0; align-items: center; }
.pv-bar span { font-size: 12px; color: var(--ink-muted); margin-right: 4px; }
.pv-tab { font: inherit; font-size: 13px; padding: 5px 10px; border-radius: var(--radius-pill); border: 1px solid var(--line-strong); background: var(--surface-100); color: var(--ink); cursor: pointer; }
.pv-tab[aria-pressed="true"] { background: var(--ink); color: var(--surface-100); border-color: var(--ink); }
.pv-tab em { font-style: normal; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; opacity: .75; margin-left: 4px; }
.pv-grid { display: grid; gap: 12px; padding: 16px; }
.pv-label { font-size: 12px; color: var(--ink-muted); margin: 0 0 6px; }

/* =====================================================================
   Modal do processo ENCERRADO — uma tela só (lz-*)
   ===================================================================== */
.lz { width: 100%; height: 100%; display: flex; flex-direction: column; background: var(--surface-100); border-radius: var(--radius-lg); box-shadow: var(--shadow-modal); overflow: hidden; outline: none; min-height: 0; }
.lz-head { position: relative; display: flex; gap: 24px; align-items: flex-start; padding: 14px 56px 12px 24px; border-bottom: 1px solid var(--line); }
.lz-head-l { flex: 1; min-width: 0; }
.lz-chips { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.lz-chip { padding: 1px 8px; border-radius: var(--radius-sm); background: var(--surface-200); color: var(--ink-muted); font-size: 12px; line-height: 18px; white-space: nowrap; }
.lz-chip b { color: var(--ink); font-weight: 600; }
.lz-link { display: inline-flex; align-items: center; gap: 4px; margin-left: 6px; color: var(--brand-text); font-size: 12px; font-weight: 600; text-decoration: none; }
.lz-link:hover { text-decoration: underline; }
.lz-title { margin: 6px 0 0; font-size: 18px; line-height: 24px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lz-orgao { color: var(--ink-muted); font-size: 13px; line-height: 18px; }
.lz-facts { display: grid; grid-template-columns: repeat(4, auto); gap: 4px 22px; margin: 2px 0 0; flex: none; }
.lz-fact dt { font-size: 10.5px; line-height: 14px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-muted); white-space: nowrap; }
.lz-fact dd { margin: 2px 0 0; font-weight: 600; font-size: 14px; white-space: nowrap; }
.lz-x { position: absolute; top: 10px; right: 12px; width: 32px; height: 32px; border: 0; border-radius: var(--radius-md); background: none; color: var(--ink-muted); display: grid; place-items: center; cursor: pointer; }
.lz-x:hover { background: var(--surface-200); color: var(--ink); }

.lz-faixa { display: flex; align-items: center; gap: 12px; margin: 12px 24px 0; padding: 10px 14px; border-radius: var(--radius-md); }
.lz-faixa-ico { flex: none; width: 30px; height: 30px; border-radius: var(--radius-pill); display: grid; place-items: center; color: var(--surface-100); }
.lz-faixa-txt { flex: 1; min-width: 0; }
.lz-faixa-txt b { font-size: 15px; line-height: 20px; }
.lz-faixa-tag { margin-left: 10px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; opacity: .85; }
.lz-faixa p { margin: 1px 0 0; font-size: 13px; line-height: 18px; }
.lz-faixa-when { text-align: right; font-size: 12px; line-height: 16px; white-space: nowrap; }
.lz-faixa-when b { display: block; font-size: 14px; line-height: 18px; }
.lz-faixa.f-warn { background: var(--warn-soft); color: var(--warn-text); border: 1px dashed color-mix(in srgb, var(--warn) 35%, transparent); } .lz-faixa.f-warn .lz-faixa-ico { background: var(--warn); }
.lz-faixa.f-danger { background: var(--danger-soft); color: var(--danger-text); } .lz-faixa.f-danger .lz-faixa-ico { background: var(--danger); }
.lz-faixa.f-neutral { background: var(--neutral-soft); color: var(--ink); } .lz-faixa.f-neutral .lz-faixa-ico { background: var(--neutral); }
.lz-faixa.f-success { background: var(--success-soft); color: var(--success-text); } .lz-faixa.f-success .lz-faixa-ico { background: var(--success); }

/* linha de fases — cada fase é um botão */
.lz-fases-wrap { padding: 12px 24px 0; }
.lz-fases { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.lz-fase { position: relative; display: grid; grid-template-columns: 24px 1fr; column-gap: 8px; align-items: center; text-align: left; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface-100); cursor: pointer; color: var(--ink); font: inherit; }
.lz-fase:hover { border-color: var(--line-strong); }
.lz-fase:not(:last-child)::after { content: ""; position: absolute; right: -7px; top: 50%; width: 8px; height: 2px; background: var(--line); }
.lz-fase.is-done:not(:last-child)::after { background: var(--brand); }
.lz-fase-dot { grid-row: span 2; width: 24px; height: 24px; border-radius: var(--radius-pill); display: grid; place-items: center; border: 2px solid var(--line-strong); color: var(--surface-100); }
.lz-fase-n { font-weight: 600; font-size: 13.5px; line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    var padX = (W - (per - 1) * step) / 2;
    var rowH = rows > 1 ? Math.max(RMIN, Math.min(160, (H - 120) / (rows - 1))) : RMIN;
    var contentH = (rows - 1) * rowH + 110, top = Math.max(44, (H - contentH) / 2 + 30);
    var pos = N.map(function (_, k) {
      var r = Math.floor(k / per), c = k % per;
      return { x: r % 2 === 0 ? padX + c * step : W - padX - c * step, y: top + r * rowH, r: r };
    });
    var selId = ETAPAS[sel].id, D = DESF[p.desfecho.tipo];
    var svg = '';
    for (var k = 1; k < n; k++) {
      var a = pos[k - 1], b = pos[k], et = N[k].k === 'end' ? N[k - 1].etapa : N[k].etapa;
      var cls = 'lz-seg' + (et === selId ? ' is-sel' : '') + (N[k].k === 'end' ? ' is-end f-' + D.fam : '');
      var dpath = a.r === b.r ? 'M' + a.x + ' ' + a.y + 'L' + b.x + ' ' + b.y
        : 'M' + a.x + ' ' + a.y + 'A' + rowH / 2 + ' ' + rowH / 2 + ' 0 0 ' + (a.r % 2 === 0 ? 1 : 0) + ' ' + b.x + ' ' + b.y;
      svg += '<path class="' + cls + '" d="' + dpath + '"/>';
    }
    var lastEt = null, html = '';
    N.forEach(function (o, k) {
      var q = pos[k], on = o.etapa === selId || o.k === 'end' && p.etapa === selId, cls = 'lz-node' + (on ? ' is-on' : ' is-off');
      var chip = '';
      if (o.k !== 'end' && o.etapa !== lastEt) { chip = '<span class="lz-node-et">' + ETAPAS[idx(o.etapa)].nome + '</span>'; lastEt = o.etapa; }
      var mark, t1, t2, t3 = '';
      if (o.k === 'ev') {
        var e = o.e, sys = !e.autor;
        mark = sys ? '<span class="lz-m lz-m--sys">' + ico('gear', 14) + '</span>' : '<span class="lz-m">' + ini(e.autor) + '</span>';
        t1 = esc(e.texto); t2 = d(e.data) + ' · ' + (sys ? 'sistema' : esc(e.autor.split(' ')[0]));
        if (e.valor != null) t3 = '<span class="num">' + brl(e.valor) + '</span>';
        if (sys) cls += ' is-sys';
      } else if (o.k === 'grp') {
        mark = '<span class="lz-m lz-m--grp">' + o.n + '×</span>';
        t1 = o.n + ' atualizações'; t2 = d(o.a.data) + '–' + d(o.b.data) + ' · ' + o.autores.map(function (a) { return a.split(' ')[0]; }).join(', ');
        t3 = '<span class="num">→ ' + brl(o.b.valor) + '</span>';
      } else {
        mark = '<span class="lz-m lz-m--end f-' + D.fam + '">' + ico(D.ico, 16) + '</span>';
        t1 = '<b>' + (p.desfecho.tipo === 'concluido' ? 'Concluído' : D.nome) + '</b>'; t2 = dA(p.desfecho.data); cls += ' is-end';
      }
      html += '<div class="' + cls + '" style="left:' + q.x + 'px;top:' + q.y + 'px" data-et="' + idx(o.etapa) + '">' + chip + mark +
        '<span class="lz-node-t">' + t1 + '</span><span class="lz-node-m">' + t2 + '</span>' + (t3 ? '<span class="lz-node-v">' + t3 + '</span>' : '') + '</div>';
    });
    var hgt = top + (rows - 1) * rowH + 100;
    return { html: '<svg class="lz-svg" width="' + W + '" height="' + hgt + '" aria-hidden="true">' + svg + '</svg>' + html, h: hgt };
  }

  /* ---------- narração da fase selecionada ---------- */
  function pontos(p, i) {
    var E = ETAPAS[i], evs = de(p, E.id), s = estado(p, i), x = p.desfecho, out = [];
    function find(t) { for (var k = 0; k < evs.length; k++) if (evs[k].tipo === t) return evs[k]; }
    if (s.c === 'after') return { pts: ['Etapa não alcançada.', 'O processo encerrou em <b>' + ETAPAS[idx(p.etapa)].nome + '</b> — ' + DESF[x.tipo].nome.toLowerCase() + ', em ' + dA(x.data) + '.'] };
    if (s.c === 'skip') return { pts: ['Nenhum registro nesta etapa.', 'O processo seguiu direto para a etapa seguinte — o sistema avisa, mas não trava.'] };
    var nx = ETAPAS[i + 1] && de(p, ETAPAS[i + 1].id)[0];
    if (E.id === 'oportunidade') {
      var sv = find('oportunidade_salva'), rm = find('removida'), pz = find('prazo_encerrado');
      out.push('Edital salvo por <b>' + esc(sv.autor) + '</b> em ' + dh(sv.data) + '.');
      out.push('Prazo da proposta: <b>' + dA(p.prazo) + ', ' + h(p.prazo) + '</b> — ' + dias(sv.data, p.prazo) + ' dias depois de salvo.');
      if (rm) out.push('Removido da lista por <b>' + esc(rm.autor) + '</b> em ' + dh(rm.data) + ', ' + dd(dias(sv.data, rm.data)) + ' depois. Motivo não informado.');
      if (pz) out.push('Ficou ' + dd(dias(sv.data, pz.data)) + ' sem cotação até o prazo vencer.');
      if (nx) out.push('Seguiu para Cotação em ' + d(nx.data) + (dias(sv.data, nx.data) ? ', ' + dd(dias(sv.data, nx.data)) + ' depois.' : ', no mesmo dia.'));
    }
    if (E.id === 'cotacao') {
      var cs = evs.filter(function (e) { return /^cotacao_/.test(e.tipo); }), c0 = cs[0], cf = cs[cs.length - 1], pz2 = find('prazo_encerrado');
      out.push('Cotação criada por <b>' + esc(c0.autor) + '</b> em ' + dh(c0.data) + ' com <span class="num">' + brl(c0.valor) + '</span>.');
      out.push('<b>' + cs.length + ' salvamentos</b> em ' + (dias(c0.data, cf.data) + 1) + ' dias, por ' + lista(uniq(cs.map(function (e) { return e.autor; }))) + '.');
      out.push('Valor final <b class="num">' + brl(cf.valor) + '</b> — ' + pct(cf.valor, p.valorEstimado) + ' do estimado, em ' + dh(cf.data) + '.');
      if (pz2) out.push('Prazo venceu ' + dd(dias(cf.data, pz2.data)) + ' após a última edição, sem proposta.');
      if (nx) out.push('Virou proposta em ' + d(nx.data) + '.');
    }
    if (E.id === 'proposta') {
      var pr = find('proposta_enviada');
      out.push('Proposta enviada por <b>' + esc(pr.autor) + '</b> em ' + dh(pr.data) + ': <span class="num">' + brl(pr.valor) + '</span> (' + pct(pr.valor, p.valorEstimado) + ' do estimado).');
      out.push('Dentro do prazo — ' + dd(dias(pr.data, p.prazo)) + ' antes de ' + dA(p.prazo) + ', ' + h(p.prazo) + '.');
      var dc = find('desclassificada'); if (dc) out.push('<b>Desclassificada</b> pelo pregoeiro em ' + dh(dc.data) + (dc.nota ? ' — ' + esc(dc.nota) : '') + '.');
    }
    if (E.id === 'disputa') {
      var se = find('sessao_aberta'), la = find('lance'), r = p.disputa;
      if (se) out.push('Sessão pública aberta em ' + dh(se.data) + '.');
      if (la) out.push('Lance final de <b class="num">' + brl(la.valor) + '</b> por ' + esc(la.autor) + (la.valorNota ? ' (' + la.valorNota + ')' : '') + '.');
      if (r && r.posicao === 1) out.push('<b>Vencemos</b> entre ' + r.participantes + ' participantes. 2º colocado: ' + esc(r.segundo) + ' com <span class="num">' + brl(r.precoSegundo) + '</span>.');
      else if (r) out.push('Vencedor: <b>' + esc(r.vencedor) + '</b> com <span class="num">' + brl(r.precoVencedor) + '</span> — ' + brl(r.nossoLance - r.precoVencedor) + ' (' + ((r.nossoLance / r.precoVencedor - 1) * 100).toFixed(1).replace('.', ',') + '%) abaixo do nosso lance. Ficamos em ' + r.posicao + 'º de ' + r.participantes + '.');
    }
    if (E.id === 'empenho') {
      evs.forEach(function (e) { out.push(esc(e.texto) + ' em ' + dh(e.data) + (e.autor ? ' por <b>' + esc(e.autor) + '</b>' : ' (sistema)') + (e.nota ? ' — ' + esc(e.nota) : '') + (e.valor ? ': <span class="num">' + brl(e.valor) + '</span>' : '') + '.'); });
    }
    return { pts: out, porque: s.c === 'stop' || s.c.indexOf('end-ok') > 0 ? x.porque : null, fam: s.fam };
  }
  function narracao(p, i) {
    var E = ETAPAS[i], s = estado(p, i), evs = de(p, E.id), r = pontos(p, i);
    var per = evs.length ? d(evs[0].data) + (d(evs[0].data) !== d(evs[evs.length - 1].data) ? ' – ' + d(evs[evs.length - 1].data) : '') + ' · ' + evs.length + (evs.length === 1 ? ' evento' : ' eventos') : '';
    return '<div class="lz-narr-head"><span class="lz-narr-k">Fase ' + (i + 1) + ' de 5</span><h3>' + E.nome + '</h3>' +
      '<span class="lz-pill is-' + s.c.split(' ')[0] + (s.fam ? ' f-' + s.fam : '') + '">' + s.rot + '</span>' + (per ? '<span class="lz-narr-per">' + per + '</span>' : '') + '</div>' +
      '<ol class="lz-pts">' + r.pts.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ol>' +
      (r.porque ? '<div class="lz-porque f-' + r.fam + '"><b>' + (p.desfecho.tipo === 'concluido' ? 'Como terminou' : 'Por que parou aqui') + '</b>' + esc(r.porque) + '</div>' : '') +
      '<div class="lz-narr-nav"><button class="lz-nav" data-go="-1"' + (i === 0 ? ' disabled' : '') + '>' + ico('left', 16) + ' Anterior</button>' +
      '<button class="lz-nav" data-go="1"' + (i === 4 ? ' disabled' : '') + '>Próxima ' + ico('right', 16) + '</button></div>';
  }

  function rodape(p) {
    var temCot = p.eventos.some(function (e) { return /^cotacao_/.test(e.tipo); }), fim = p.desfecho.tipo === 'concluido';
    return '<footer class="lz-foot"><span class="lz-foot-note">' + ico('lock', 14) + ' Somente consulta' + (temCot ? ' · a cotação abre só para leitura' : '') + '<span class="lz-kbd">← → navegam pelas fases</span></span>' +
      (fim ? '' : '<button class="lz-btn lz-btn--ghost" disabled title="Disponível em breve">' + ico('redo', 16) + ' Reabrir processo <span class="lz-soon">em breve</span></button>') +
      (temCot ? '<button class="lz-btn">' + ico('down', 16) + ' Exportar planilha</button><button class="lz-btn lz-btn--primary">' + ico('doc', 16) + ' Ver cotação</button>'
        : '<button class="lz-btn lz-btn--primary">' + ico('ext', 16) + ' Abrir edital no PNCP</button>') + '</footer>';
  }

  function montar(root, p) {
    var sel = idx(p.etapa);
    root.innerHTML = '<div class="lc lz lz--v" role="dialog" aria-modal="true" aria-label="' + esc(p.objeto) + '" tabindex="-1">' + cabecalho(p) +
      '<div class="lz-scroll">' + faixa(p) + '<div class="lz-fases-wrap"></div>' +
      '<div class="lz-vbody"><div class="lz-vtl"><div class="lc-sec-title">Linha do tempo</div>' + LC.linhaDoTempo(p) + '</div>' +
      '<aside class="lz-narr" aria-live="polite"></aside></div></div>' + rodape(p) + '</div>';
    var M = root.firstChild, sc = M.querySelector('.lz-scroll'), fw = M.querySelector('.lz-fases-wrap');
    var secs = [].slice.call(M.querySelectorAll('.lc-tl-stage'));
    secs.forEach(function (el) {
      var nome = el.querySelector('h4').textContent;
      for (var i = 0; i < ETAPAS.length; i++) if (ETAPAS[i].nome === nome) el.dataset.et = i;
      el.querySelector('.lc-tl-stage-head').insertAdjacentHTML('beforeend', '<span class="lz-v-status"></span>');
    });
    function draw(rolar) {
      fw.innerHTML = fases(p, sel);
      M.querySelector('.lz-narr').innerHTML = narracao(p, sel);
      var alvo = null;
      secs.forEach(function (el) {
        var on = +el.dataset.et === sel; el.classList.toggle('is-sel', on); el.classList.toggle('is-dim', !on);
        var st = estado(p, +el.dataset.et); el.querySelector('.lz-v-status').innerHTML = '<span class="lz-pill is-' + st.c.split(' ')[0] + (st.fam ? ' f-' + st.fam : '') + '">' + st.rot + '</span>';
        if (on) alvo = el;
      });
      var end = M.querySelector('.lc-tl-end'); if (end) end.classList.toggle('is-dim', sel !== idx(p.etapa));
      if (rolar) {
        var y = alvo ? alvo.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop - fw.offsetHeight - 16
          : M.querySelector('.lz-vbody').offsetTop - fw.offsetHeight - 8;
        sc.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
      }
    }
    function go(i) { sel = Math.max(0, Math.min(4, i)); draw(true); }
    M.addEventListener('click', function (ev) {
      if (ev.target.closest('summary')) return;
      var b = ev.target.closest('[data-i]'); if (b) return go(+b.dataset.i);
      var g = ev.target.closest('[data-go]'); if (g) return go(sel + +g.dataset.go);
      var s2 = ev.target.closest('.lc-tl-stage[data-et]'); if (s2 && +s2.dataset.et !== sel) { sel = +s2.dataset.et; draw(false); }
    });
    M.addEventListener('keydown', function (ev) { if (ev.key === 'ArrowRight') go(sel + 1); if (ev.key === 'ArrowLeft') go(sel - 1); });
    draw(false);
    M.focus({ preventScroll: true });
    return M;
  }

  window.LZ = { montar: montar };
})();

function show(k){ LZ.montar(document.getElementById('stage'), LC_DATA[k]);
  document.querySelectorAll('.pv-tab').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.k===k)); }); }
document.querySelectorAll('.pv-tab').forEach(function(b){ b.onclick=function(){ show(b.dataset.k); }; });
show(location.hash.slice(1) || 'prazoCotacao');
</script>
