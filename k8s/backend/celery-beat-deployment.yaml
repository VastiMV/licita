# Agendador — `DatabaseScheduler` (django_celery_beat), schedule editável via
# /admin/ em vez de hardcoded (ver docs/ARQUITETURA.md). Travado em 1 réplica
# de propósito: é singleton por definição, duas instâncias disparariam a
# mesma task duplicada. Nunca escalar isto horizontalmente.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: inside-solutions-licita
  labels:
    app: celery-beat
spec:
  replicas: 1
  strategy:
    type: Recreate  # nunca dois beats no ar ao mesmo tempo, nem durante rollout
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: celery-beat
          image: ghcr.io/vastimv/licita-backend:latest
          imagePullPolicy: Always
          command:
            ["celery", "-A", "config", "beat", "--loglevel=INFO",
             "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
            - secretRef:
                name: postgres-secrets
            - secretRef:
                name: rabbitmq-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
