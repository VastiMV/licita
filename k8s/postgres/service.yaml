# Headless (clusterIP: None) — padrão pra Service de um StatefulSet, dá DNS
# estável (postgres.inside-solutions-licita.svc.cluster.local) pro pod.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: inside-solutions-licita
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
