# /api/* vai pro backend (ainda sem Deployment — ver k8s/backend/service.yaml);
# todo o resto vai pro frontend.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: licita
  namespace: inside-solutions-licita
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: licita.derla.com.br
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
  tls:
    - hosts:
        - licita.derla.com.br
      secretName: licita-tls
